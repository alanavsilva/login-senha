<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="login-body">

    <main>
        <div class="p-3 mb-2 bg-info-subtle text-info-emphasis">
            <div class="container">
                <h2 id="titulo">Login</h2>

                <form id="form-login">
                    <div id="c-email" classe="conjunto">
                        <label for="email">Email: </label>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>

                    <div id="c-senha" classe="conjunto">
                        <label for="senha">Senha: </label>
                        <input type="senha" id="senha" placeholder="Senha" required>
                    </div>

                    <button id="botao-envio" type="submit">Entrar</button>

                </form>

                <div id="mensagem"></div>
                <div class="toggle" id="toggle">
                    <p> Não tem conta? Cadastre-se! </p>

                </div>

            </div>


        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
